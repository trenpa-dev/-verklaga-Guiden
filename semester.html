<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semesterplanering 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // Halvveckor = arbetsdagar: mån–tis (2 dagar), ons–fre (3 dagar)
    const WEEKS = [
      { week: 25, half1: { dates: '15–16 jun', days: 2 }, half2: { dates: '17–19 jun', days: 3 } },
      { week: 26, half1: { dates: '22–23 jun', days: 2 }, half2: { dates: '24–26 jun', days: 3 } },
      { week: 27, half1: { dates: '29–30 jun', days: 2 }, half2: { dates: '1–3 jul', days: 3 } },
      { week: 28, half1: { dates: '6–7 jul', days: 2 }, half2: { dates: '8–10 jul', days: 3 } },
      { week: 29, half1: { dates: '13–14 jul', days: 2 }, half2: { dates: '15–17 jul', days: 3 } },
      { week: 30, half1: { dates: '20–21 jul', days: 2 }, half2: { dates: '22–24 jul', days: 3 } },
      { week: 31, half1: { dates: '27–28 jul', days: 2 }, half2: { dates: '29–31 jul', days: 3 } },
      { week: 32, half1: { dates: '3–4 aug', days: 2 }, half2: { dates: '5–7 aug', days: 3 } },
      { week: 33, half1: { dates: '10–11 aug', days: 2 }, half2: { dates: '12–14 aug', days: 3 } },
      { week: 34, half1: { dates: '17–18 aug', days: 2 }, half2: { dates: '19–21 aug', days: 3 } },
    ]

    const COLORS = [
      { sel: 'bg-blue-500 text-white border-blue-500', unsel: 'bg-white text-blue-600 border-blue-200', summary: 'bg-blue-50 border-blue-300 text-blue-700', bar: 'bg-blue-500', dot: 'bg-blue-500' },
      { sel: 'bg-emerald-500 text-white border-emerald-500', unsel: 'bg-white text-emerald-600 border-emerald-200', summary: 'bg-emerald-50 border-emerald-300 text-emerald-700', bar: 'bg-emerald-500', dot: 'bg-emerald-500' },
      { sel: 'bg-violet-500 text-white border-violet-500', unsel: 'bg-white text-violet-600 border-violet-200', summary: 'bg-violet-50 border-violet-300 text-violet-700', bar: 'bg-violet-500', dot: 'bg-violet-500' },
      { sel: 'bg-amber-500 text-white border-amber-500', unsel: 'bg-white text-amber-600 border-amber-200', summary: 'bg-amber-50 border-amber-300 text-amber-700', bar: 'bg-amber-500', dot: 'bg-amber-500' },
      { sel: 'bg-rose-500 text-white border-rose-500', unsel: 'bg-white text-rose-600 border-rose-200', summary: 'bg-rose-50 border-rose-300 text-rose-700', bar: 'bg-rose-500', dot: 'bg-rose-500' },
    ]

    function App() {
      const [people, setPeople] = React.useState([
        { id: 1, name: 'Person 1', budget: 25 },
        { id: 2, name: 'Person 2', budget: 25 },
      ])
      const [editingId, setEditingId] = React.useState(null)
      const [editField, setEditField] = React.useState(null)
      const [editVal, setEditVal] = React.useState('')
      const [selections, setSelections] = React.useState({})
      const [nextId, setNextId] = React.useState(3)

      function toggle(personId, weekNum, half) {
        const key = `${weekNum}-${half}`
        setSelections(prev => {
          const cur = new Set(prev[personId] || [])
          cur.has(key) ? cur.delete(key) : cur.add(key)
          return { ...prev, [personId]: new Set(cur) }
        })
      }

      function isSel(personId, weekNum, half) {
        return (selections[personId] || new Set()).has(`${weekNum}-${half}`)
      }

      function addPerson() {
        const id = nextId
        setPeople(p => [...p, { id, name: `Person ${id}`, budget: 25 }])
        setNextId(id + 1)
      }

      function removePerson(id) {
        setPeople(p => p.filter(x => x.id !== id))
        setSelections(p => { const n = {...p}; delete n[id]; return n })
      }

      function startEdit(id, field, val) {
        setEditingId(id); setEditField(field); setEditVal(String(val))
      }

      function commitEdit(id) {
        setPeople(p => p.map(x => {
          if (x.id !== id) return x
          if (editField === 'name') return { ...x, name: editVal || x.name }
          if (editField === 'budget') return { ...x, budget: Math.max(0, parseInt(editVal) || 0) }
          return x
        }))
        setEditingId(null); setEditField(null)
      }

      function usedDays(personId) {
        let t = 0
        for (const key of (selections[personId] || new Set())) {
          const [ws, half] = key.split('-')
          const w = WEEKS.find(x => x.week === parseInt(ws))
          if (w) t += w[half].days
        }
        return t
      }

      function getCommon() {
        if (people.length < 2) return new Set()
        const sets = people.map(p => selections[p.id] || new Set())
        const common = new Set()
        for (const key of sets[0]) {
          if (sets.every(s => s.has(key))) common.add(key)
        }
        return common
      }

      function sumDays(keys) {
        let t = 0
        for (const key of keys) {
          const [ws, half] = key.split('-')
          const w = WEEKS.find(x => x.week === parseInt(ws))
          if (w) t += w[half].days
        }
        return t
      }

      const common = getCommon()

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 via-white to-amber-50">
          <header className="bg-white border-b border-slate-200 px-4 py-3 shadow-sm sticky top-0 z-10">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 bg-amber-400 rounded-xl flex items-center justify-center text-lg">☀️</div>
              <div>
                <div className="font-bold text-slate-800">Semesterplanering 2026</div>
                <div className="text-xs text-slate-500">Vecka 25–34 · Arbetsdagar</div>
              </div>
            </div>
          </header>

          <div className="p-4 space-y-4 max-w-2xl mx-auto">

            {/* People */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
              <div className="flex items-center justify-between mb-3">
                <span className="font-semibold text-slate-700 text-sm">👥 Personer</span>
                {people.length < 5 &&
                  <button onClick={addPerson} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg">
                    + Lägg till
                  </button>
                }
              </div>
              <div className="flex flex-col gap-2">
                {people.map((p, i) => {
                  const c = COLORS[i % COLORS.length]
                  const used = usedDays(p.id)
                  const pct = p.budget > 0 ? Math.min(100, Math.round(used / p.budget * 100)) : 0
                  const over = used > p.budget
                  return (
                    <div key={p.id} className={`flex items-center gap-3 px-3 py-2.5 rounded-xl border ${c.summary}`}>
                      <div className={`w-2.5 h-2.5 rounded-full shrink-0 ${c.dot}`} />
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 flex-wrap">
                          {editingId === p.id && editField === 'name' ? (
                            <input autoFocus value={editVal}
                              onChange={e => setEditVal(e.target.value)}
                              onBlur={() => commitEdit(p.id)}
                              onKeyDown={e => e.key === 'Enter' && commitEdit(p.id)}
                              className="text-sm font-semibold bg-transparent outline-none border-b border-current w-28"
                            />
                          ) : (
                            <span className="text-sm font-semibold cursor-pointer hover:underline"
                              onClick={() => startEdit(p.id, 'name', p.name)}>{p.name}</span>
                          )}
                          <span className="text-xs opacity-60">
                            {used} av{' '}
                            {editingId === p.id && editField === 'budget' ? (
                              <input autoFocus value={editVal} type="number" min="0" max="50"
                                onChange={e => setEditVal(e.target.value)}
                                onBlur={() => commitEdit(p.id)}
                                onKeyDown={e => e.key === 'Enter' && commitEdit(p.id)}
                                className="w-10 bg-transparent outline-none border-b border-current font-semibold inline"
                              />
                            ) : (
                              <span className="font-semibold cursor-pointer hover:underline"
                                onClick={() => startEdit(p.id, 'budget', p.budget)}>{p.budget}</span>
                            )}
                            {' '}dagar {over && <span className="text-red-500 font-bold">({used - p.budget} för många!)</span>}
                          </span>
                        </div>
                        <div className="mt-1.5 h-1.5 bg-black/10 rounded-full overflow-hidden">
                          <div className={`h-full rounded-full transition-all ${over ? 'bg-red-500' : c.bar}`}
                            style={{ width: `${pct}%` }} />
                        </div>
                      </div>
                      {people.length > 1 &&
                        <button onClick={() => removePerson(p.id)} className="opacity-30 hover:opacity-60 text-xs shrink-0">✕</button>
                      }
                    </div>
                  )
                })}
              </div>
              <p className="text-[10px] text-slate-400 mt-2">Klicka på namn eller antal dagar för att redigera</p>
            </div>

            {/* Grid */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="px-4 py-3 bg-slate-50 border-b border-slate-100">
                <span className="font-semibold text-slate-700 text-sm">📅 Välj semesterperioder</span>
              </div>
              <div className="grid grid-cols-3 text-xs text-slate-400 font-semibold px-3 py-2 bg-slate-50 border-b border-slate-100 uppercase tracking-wide">
                <div>Vecka</div>
                <div className="text-center">Mån–Tis <span className="font-normal normal-case">(2 dagar)</span></div>
                <div className="text-center">Ons–Fre <span className="font-normal normal-case">(3 dagar)</span></div>
              </div>

              {WEEKS.map((w, wi) => (
                <div key={w.week} className={`grid grid-cols-3 border-b border-slate-100 last:border-0 ${wi % 2 ? 'bg-slate-50/40' : ''}`}>
                  <div className="flex items-center px-3 py-2">
                    <span className="font-bold text-slate-600 text-sm">v.{w.week}</span>
                  </div>
                  {['half1','half2'].map(half => (
                    <div key={half} className="border-l border-slate-100 p-2">
                      <div className="text-center text-[10px] text-slate-400 mb-1">{w[half].dates}</div>
                      <div className="flex flex-col gap-1">
                        {people.map((p, i) => {
                          const c = COLORS[i % COLORS.length]
                          const sel = isSel(p.id, w.week, half)
                          return (
                            <button key={p.id}
                              onClick={() => toggle(p.id, w.week, half)}
                              className={`w-full py-1.5 px-1 rounded-lg text-xs font-medium border transition-all ${sel ? c.sel : c.unsel}`}>
                              {p.name}
                            </button>
                          )
                        })}
                        {common.has(`${w.week}-${half}`) &&
                          <div className="text-center text-[10px] text-amber-500 font-bold">★ Gemen.</div>
                        }
                      </div>
                    </div>
                  ))}
                </div>
              ))}
            </div>

            {/* Summary */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
              <div className="font-semibold text-slate-700 text-sm mb-3">Sammanfattning</div>
              <div className="grid grid-cols-2 gap-2">
                {people.map((p, i) => {
                  const c = COLORS[i % COLORS.length]
                  const used = usedDays(p.id)
                  const left = p.budget - used
                  const over = left < 0
                  return (
                    <div key={p.id} className={`rounded-xl p-3 border ${c.summary}`}>
                      <div className="flex items-center gap-1.5 mb-2">
                        <div className={`w-2 h-2 rounded-full ${c.dot}`} />
                        <span className="font-semibold text-sm">{p.name}</span>
                      </div>
                      <div className="flex items-end gap-1 mb-1">
                        <span className="text-2xl font-bold">{used}</span>
                        <span className="text-xs opacity-60 mb-0.5">/ {p.budget} dagar</span>
                      </div>
                      <div className={`text-xs font-semibold ${over ? 'text-red-500' : 'opacity-70'}`}>
                        {over ? `${Math.abs(left)} dagar för många` : `${left} dagar kvar`}
                      </div>
                      <div className="mt-2 h-1.5 bg-black/10 rounded-full overflow-hidden">
                        <div className={`h-full rounded-full ${over ? 'bg-red-500' : c.bar}`}
                          style={{ width: `${Math.min(100, p.budget > 0 ? used/p.budget*100 : 0)}%` }} />
                      </div>
                    </div>
                  )
                })}
                {people.length >= 2 && (
                  <div className="rounded-xl p-3 border bg-amber-50 border-amber-200 text-amber-700">
                    <div className="flex items-center gap-1.5 mb-2">
                      <span className="text-amber-400">★</span>
                      <span className="font-semibold text-sm">Gemensamt</span>
                    </div>
                    <div className="text-2xl font-bold mb-1">{sumDays(common)}</div>
                    <div className="text-xs opacity-70">{common.size} halvveckor</div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
  </script>
</body>
</html>
